name: Fix current Dart analyze errors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact Dart fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fixes = {
              "lib/features/children/kindergarten_stage_screen_v4.dart": [
                  ("import 'package:flutter/material.dart';\n", "import 'dart:math' as math;\nimport 'package:flutter/material.dart';\n"),
                  ("..scale(1.02)", "..scaleByDouble(1.02)"),
                  ("fontWeight: FontWeight.w900))))),\n    ]);", "fontWeight: FontWeight.w900)))))) ,\n    ]);"),
                  ("Math.cos(a)", "math.cos(a)"),
                  ("Math.sin(a)", "math.sin(a)"),
              ],
              "lib/features/quiz/final_exam_screen_v8.dart": [
                  ("import 'package:flutter/material.dart';\n", "import 'dart:math' as math;\nimport 'package:flutter/material.dart';\n"),
                  ("fontSize: 21))))),", "fontSize: 21))))),"),
                  ("child: Text(option, style: const TextStyle(fontSize: 21))))),", "child: Text(option, style: const TextStyle(fontSize: 21))))));"),
                  ("Math.cos(a)", "math.cos(a)"),
                  ("Math.sin(a)", "math.sin(a)"),
              ],
          }

          for filename, replacements in fixes.items():
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {filename}: {old!r}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/children/kindergarten_stage_screen_v4.dart lib/features/quiz/final_exam_screen_v8.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix: resolve Dart analyze syntax and math errors"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-current-analyze-errors.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary fix workflow" || true
          git push || true
