name: Add kindergarten coloring drawings

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update-coloring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace kindergarten colors page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/features/children/kindergarten_stage_screen_v4.dart')
          s = p.read_text()
          start = s.index('class _ColorsPageState extends State<_ColorsPage> {')
          end = s.index('class _ShapesPage extends StatelessWidget {', start)

          new = r'''class _ColorsPageState extends State<_ColorsPage> {
  int drawing = 0;
  Color selected = const Color(0xFFF44336);
  final colors = const <Color>[
    Color(0xFFF44336), Color(0xFF2196F3), Color(0xFFFFC107),
    Color(0xFF4CAF50), Color(0xFFFF8A00), Color(0xFF8E5CF6),
    Color(0xFF00AFA5),
  ];
  final names = const ['أحمر','أزرق','أصفر','أخضر','برتقالي','بنفسجي','تركوازي'];
  final drawings = const ['قطة','سمكة','نعجة','أرنب','تفاحة','فراشة','فيل','زهرة'];
  late final List<Color> fills = List<Color>.filled(8, Colors.white);

  @override
  Widget build(BuildContext context) => _Page('الألوان والتلوين', [
    Text('اختر اللون: ${names[colors.indexOf(selected)]}', textAlign: TextAlign.center, style: const TextStyle(fontSize: 21, fontWeight: FontWeight.w900)),
    const SizedBox(height: 6),
    Wrap(
      alignment: WrapAlignment.center,
      children: [
        for (var i = 0; i < colors.length; i++)
          GestureDetector(
            onTap: () {
              setState(() => selected = colors[i]);
              VoiceService.arabic(names[i]);
            },
            child: Container(
              width: 42,
              height: 42,
              margin: const EdgeInsets.all(5),
              decoration: BoxDecoration(
                color: colors[i],
                shape: BoxShape.circle,
                border: Border.all(color: selected == colors[i] ? Colors.black : Colors.transparent, width: 4),
              ),
            ),
          ),
      ],
    ),
    const SizedBox(height: 8),
    Text('لوّن ${drawings[drawing]} بالضغط على أجزاء الرسم.', textAlign: TextAlign.center, style: const TextStyle(fontSize: 19, fontWeight: FontWeight.w800)),
    const SizedBox(height: 6),
    SizedBox(
      height: 330,
      child: Container(
        decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(24), border: Border.all(color: selected, width: 3)),
        child: GestureDetector(
          onTapUp: (d) {
            final part = _partAt(d.localPosition, Size(MediaQuery.sizeOf(context).width - 32, 330), drawing);
            if (part != null && part < fills.length) setState(() => fills[part] = selected);
          },
          child: CustomPaint(painter: _ColoringPainter(drawing, fills), child: const SizedBox.expand()),
        ),
      ),
    ),
    const SizedBox(height: 8),
    Row(children: [
      Expanded(child: _Btn('↩ تراجع', const Color(0xFF7652FF), () => setState(() {
        final p = fills.lastIndexWhere((c) => c != Colors.white);
        if (p >= 0) fills[p] = Colors.white;
      }))),
      const SizedBox(width: 8),
      Expanded(child: _Btn('🗑 مسح الألوان', const Color(0xFFE53935), () => setState(() {
        for (var i = 0; i < fills.length; i++) fills[i] = Colors.white;
      }))),
    ]),
    const SizedBox(height: 8),
    Row(children: [
      Expanded(child: _Btn('السابق', const Color(0xFFE94F9B), drawing > 0 ? () => setState(() => drawing--) : () {})),
      const SizedBox(width: 8),
      Expanded(child: _Btn('التالي', const Color(0xFF16B878), drawing < drawings.length - 1 ? () => setState(() => drawing++) : () {})),
    ]),
  ]);

  int? _partAt(Offset p, Size size, int type) {
    final x = p.dx / size.width;
    final y = p.dy / size.height;
    if (type == 0) { // قطة
      if (y < .34 && x < .42) return 2;
      if (y < .34 && x > .58) return 3;
      if (y < .48) return 1;
      if (x > .72) return 4;
      if (y < .78) return 0;
    } else if (type == 1) { // سمكة
      if (x > .72) return 1;
      if (y < .35 && x > .28 && x < .7) return 2;
      if (y > .65 && x > .28 && x < .7) return 3;
      return 0;
    } else if (type == 2) { // نعجة
      if (x > .68 && y < .55) return 1;
      if (y > .58) return 2;
      return 0;
    } else if (type == 3) { // أرنب
      if (y < .30) return x < .5 ? 2 : 3;
      if (y < .52) return 1;
      if (y > .68) return 2;
      return 0;
    } else if (type == 4) { // تفاحة
      if (y < .27 && x > .5) return 1;
      if (y < .35) return 2;
      return 0;
    } else if (type == 5) { // فراشة
      if (x < .48) return 0;
      if (x > .52) return 1;
      return 2;
    } else if (type == 6) { // فيل
      if (x > .7 && y > .25 && y < .7) return 2;
      if (x > .58 && y < .48) return 1;
      if (y > .68) return 3;
      return 0;
    } else { // زهرة
      if (y > .65) return x < .35 ? 2 : 3;
      if (y > .42) return 1;
      final cx = .5, cy = .30;
      final a = math.atan2(y - cy, x - cx);
      final sector = (((a + math.pi) / (2 * math.pi)) * 4).floor().clamp(0, 3);
      return sector + 4;
    }
    return null;
  }
}

class _ColoringPainter extends CustomPainter {
  final int type;
  final List<Color> fills;
  _ColoringPainter(this.type, this.fills);

  Paint _fill(int i) => Paint()..color = fills[i];
  Paint get outline => Paint()..style = PaintingStyle.stroke..strokeWidth = 5..color = Colors.black87;

  @override
  void paint(Canvas canvas, Size size) {
    final c = Offset(size.width / 2, size.height / 2 + 15);
    final o = outline;
    final f = Paint();
    if (type == 0) {
      final body = Rect.fromCenter(center: c.translate(0, 45), width: 210, height: 120);
      canvas.drawOval(body, _fill(0)); canvas.drawOval(body, o);
      final head = Rect.fromCenter(center: c.translate(0, -55), width: 135, height: 115);
      canvas.drawOval(head, _fill(1)); canvas.drawOval(head, o);
      final l = Path()..moveTo(c.dx - 55, c.dy - 105)..lineTo(c.dx - 40, c.dy - 160)..lineTo(c.dx - 5, c.dy - 120)..close();
      final r = Path()..moveTo(c.dx + 55, c.dy - 105)..lineTo(c.dx + 40, c.dy - 160)..lineTo(c.dx + 5, c.dy - 120)..close();
      canvas.drawPath(l, _fill(2)); canvas.drawPath(l, o); canvas.drawPath(r, _fill(3)); canvas.drawPath(r, o);
      final tail = Path()..moveTo(c.dx + 100, c.dy + 50)..quadraticBezierTo(c.dx + 170, c.dy + 10, c.dx + 145, c.dy - 35);
      canvas.drawPath(tail, o);
      canvas.drawCircle(c.translate(-25, -65), 7, Paint()..color = Colors.black); canvas.drawCircle(c.translate(25, -65), 7, Paint()..color = Colors.black);
    } else if (type == 1) {
      final body = Rect.fromCenter(center: c, width: 250, height: 125);
      canvas.drawOval(body, _fill(0)); canvas.drawOval(body, o);
      final tail = Path()..moveTo(c.dx + 105, c.dy)..lineTo(c.dx + 165, c.dy - 55)..lineTo(c.dx + 165, c.dy + 55)..close();
      canvas.drawPath(tail, _fill(1)); canvas.drawPath(tail, o);
      final fin = Path()..moveTo(c.dx - 20, c.dy - 40)..lineTo(c.dx + 25, c.dy - 90)..lineTo(c.dx + 55, c.dy - 25)..close();
      canvas.drawPath(fin, _fill(2)); canvas.drawPath(fin, o);
      canvas.drawCircle(c.translate(-70, -15), 7, Paint()..color = Colors.black);
    } else if (type == 2) {
      final body = Rect.fromCenter(center: c.translate(-15, 35), width: 245, height: 135);
      canvas.drawOval(body, _fill(0)); canvas.drawOval(body, o);
      final head = Rect.fromCenter(center: c.translate(105, -25), width: 75, height: 85);
      canvas.drawOval(head, _fill(1)); canvas.drawOval(head, o);
      for (final dx in [-75.0, -25.0, 30.0, 75.0]) canvas.drawLine(c.translate(dx, 95), c.translate(dx, 145), o);
      canvas.drawCircle(c.translate(120, -35), 5, Paint()..color = Colors.black);
    } else if (type == 3) {
      final body = Rect.fromCenter(center: c.translate(0, 50), width: 155, height: 150);
      canvas.drawOval(body, _fill(0)); canvas.drawOval(body, o);
      final head = Rect.fromCenter(center: c.translate(0, -55), width: 105, height: 95);
      canvas.drawOval(head, _fill(1)); canvas.drawOval(head, o);
      final le = Rect.fromCenter(center: c.translate(-30, -135), width: 28, height: 100);
      final re = Rect.fromCenter(center: c.translate(30, -135), width: 28, height: 100);
      canvas.drawOval(le, _fill(2)); canvas.drawOval(le, o); canvas.drawOval(re, _fill(3)); canvas.drawOval(re, o);
      canvas.drawCircle(c.translate(-20, -60), 5, Paint()..color = Colors.black); canvas.drawCircle(c.translate(20, -60), 5, Paint()..color = Colors.black);
    } else if (type == 4) {
      final path = Path()..moveTo(c.dx, c.dy - 5)..cubicTo(c.dx - 115, c.dy - 70, c.dx - 105, c.dy + 110, c.dx, c.dy + 125)..cubicTo(c.dx + 105, c.dy + 110, c.dx + 115, c.dy - 70, c.dx, c.dy - 5)..close();
      canvas.drawPath(path, _fill(0)); canvas.drawPath(path, o);
      canvas.drawLine(c.translate(0, -5), c.translate(5, -60), o);
      final leaf = Path()..moveTo(c.dx + 5, c.dy - 45)..quadraticBezierTo(c.dx + 70, c.dy - 80, c.dx + 60, c.dy - 25)..close();
      canvas.drawPath(leaf, _fill(1)); canvas.drawPath(leaf, o);
    } else if (type == 5) {
      final left = Path()..moveTo(c.dx - 10, c.dy)..cubicTo(c.dx - 145, c.dy - 105, c.dx - 150, c.dy + 70, c.dx - 10, c.dy + 25)..close();
      final right = Path()..moveTo(c.dx + 10, c.dy)..cubicTo(c.dx + 145, c.dy - 105, c.dx + 150, c.dy + 70, c.dx + 10, c.dy + 25)..close();
      canvas.drawPath(left, _fill(0)); canvas.drawPath(left, o); canvas.drawPath(right, _fill(1)); canvas.drawPath(right, o);
      canvas.drawOval(Rect.fromCenter(center: c.translate(0, 15), width: 28, height: 100), _fill(2)); canvas.drawOval(Rect.fromCenter(center: c.translate(0, 15), width: 28, height: 100), o);
      canvas.drawLine(c.translate(-8, -35), c.translate(-45, -80), o); canvas.drawLine(c.translate(8, -35), c.translate(45, -80), o);
    } else if (type == 6) {
      final body = Rect.fromCenter(center: c.translate(-25, 35), width: 245, height: 150);
      canvas.drawOval(body, _fill(0)); canvas.drawOval(body, o);
      final head = Rect.fromCenter(center: c.translate(85, -35), width: 95, height: 105);
      canvas.drawOval(head, _fill(1)); canvas.drawOval(head, o);
      canvas.drawOval(Rect.fromCenter(center: c.translate(35, -35), width: 55, height: 75), _fill(2)); canvas.drawOval(Rect.fromCenter(center: c.translate(35, -35), width: 55, height: 75), o);
      final trunk = Path()..moveTo(c.dx + 120, c.dy - 10)..quadraticBezierTo(c.dx + 185, c.dy + 25, c.dx + 135, c.dy + 65);
      canvas.drawPath(trunk, o);
      for (final dx in [-90.0, -30.0, 35.0, 75.0]) canvas.drawLine(c.translate(dx, 100), c.translate(dx, 155), o);
    } else {
      final center = c.translate(0, -45);
      for (var i = 0; i < 4; i++) {
        final a = i * math.pi / 2;
        final pc = center + Offset(70 * math.cos(a), 70 * math.sin(a));
        canvas.drawCircle(pc, 55, _fill(i + 4)); canvas.drawCircle(pc, 55, o);
      }
      canvas.drawCircle(center, 38, _fill(1)); canvas.drawCircle(center, 38, o);
      canvas.drawLine(c.translate(0, 5), c.translate(0, 135), o);
      final leaf1 = Path()..moveTo(c.dx, c.dy + 70)..quadraticBezierTo(c.dx - 75, c.dy + 35, c.dx - 80, c.dy + 85)..close();
      final leaf2 = Path()..moveTo(c.dx, c.dy + 95)..quadraticBezierTo(c.dx + 75, c.dy + 60, c.dx + 80, c.dy + 110)..close();
      canvas.drawPath(leaf1, _fill(2)); canvas.drawPath(leaf1, o); canvas.drawPath(leaf2, _fill(3)); canvas.drawPath(leaf2, o);
    }
    final label = TextPainter(text: TextSpan(text: drawingsLabel(type), style: const TextStyle(fontSize: 26, color: Colors.black87, fontWeight: FontWeight.bold)), textDirection: TextDirection.rtl)..layout();
    label.paint(canvas, Offset((size.width - label.width) / 2, 10));
  }

  @override
  bool shouldRepaint(covariant _ColoringPainter oldDelegate) => oldDelegate.type != type || oldDelegate.fills != fills;
}

String drawingsLabel(int i) => const ['قطة','سمكة','نعجة','أرنب','تفاحة','فراشة','فيل','زهرة'][i];

'''
          s = s[:start] + new + s[end:]
          p.write_text(s)
          PY

          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
