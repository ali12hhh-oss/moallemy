name: Flutter Android CI

# Every push to main/master automatically runs analysis, tests, APK build and AAB build.
on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: write

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair truncated kindergarten screen
        shell: bash
        run: |
          set -euo pipefail
          file="lib/features/children/kindergarten_stage_screen_v4.dart"
          if [ -f "$file" ]; then
            tail_text="$(tail -n 8 "$file")"
            if printf '%s\n' "$tail_text" | grep -q "_Btn(_ar(value), const Color(0xFF16B878), () => answer(value))," && ! printf '%s\n' "$tail_text" | grep -q '^}$'; then
              printf '\n  }\n}\n' >> "$file"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "$file"
              git commit -m "fix: close truncated kindergarten screen"

              # The repository may receive another commit while this job is running.
              # Rebase before pushing, and retry so the repair cannot fail only because
              # the remote branch advanced during the build.
              pushed=false
              for attempt in 1 2 3 4 5; do
                git fetch origin main
                if ! git rebase origin/main; then
                  git rebase --abort || true
                  echo "Rebase failed on attempt $attempt; retrying from the current remote state."
                elif git push origin HEAD:main; then
                  pushed=true
                  break
                else
                  echo "Push rejected on attempt $attempt; the remote advanced. Retrying."
                fi
                sleep 2
              done
              if [ "$pushed" != true ]; then
                echo "ERROR: Could not persist the kindergarten repair after 5 attempts."
                exit 1
              fi
            fi
          fi

      - name: Verify Android project
        run: |
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Locate and verify APK
        shell: bash
        run: |
          set -euo pipefail
          echo "APK files produced by the build:"
          find build -type f -name '*.apk' -print | sort
          apk="$(find build -type f -name 'app-release.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "ERROR: app-release.apk was not produced anywhere under build/."
            exit 1
          fi
          mkdir -p build/app/outputs/flutter-apk
          if [ "$apk" != "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "$apk" build/app/outputs/flutter-apk/app-release.apk
          fi
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Verify AAB
        run: |
          set -euo pipefail
          aab="$(find build -type f -name 'app-release.aab' -print -quit)"
          if [ -z "$aab" ]; then
            echo "ERROR: app-release.aab was not produced anywhere under build/."
            exit 1
          fi
          mkdir -p build/app/outputs/bundle/release
          if [ "$aab" != "build/app/outputs/bundle/release/app-release.aab" ]; then
            cp "$aab" build/app/outputs/bundle/release/app-release.aab
          fi
          test -s build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
