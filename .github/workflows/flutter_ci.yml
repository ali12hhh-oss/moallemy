name: Flutter Android CI

# Every push to main/master automatically runs analysis, tests, APK build and AAB build.
# There is intentionally no self-modifying repair step: source changes must be committed normally.

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Android project
        run: |
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Verify AAB
        run: |
          test -f build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
