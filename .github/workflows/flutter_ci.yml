name: Flutter Android CI
# CI build is intentionally kept active so every main-branch change is analyzed, tested, and built.

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: write

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair known kindergarten Dart issues
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/children/kindergarten_stage_screen_v4.dart')
          s = p.read_text()
          s = s.replace("import 'package:flutter/material.dart';", "import 'dart:math' as math;\nimport 'package:flutter/material.dart';", 1)
          s = s.replace('(Matrix4.identity()..scale(1.02))', '(Matrix4.identity()..scaleByDouble(1.02, 1.02, 1.0, 1.0))')
          s = s.replace('))))),\n    ]);', ')))),\n    ]);')
          s = s.replace('Math.cos', 'math.cos').replace('Math.sin', 'math.sin')
          p.write_text(s)
          PY
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/features/children/kindergarten_stage_screen_v4.dart
            git commit -m 'fix: repair kindergarten Dart syntax and math API'
            git push
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Android project
        run: |
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # ------------------------------------------------------------
      # Build APK
      # ------------------------------------------------------------
      - name: Build APK
        shell: bash
        run: |
          set +e

          flutter build apk --release
          FLUTTER_EXIT=$?

          echo ""
          echo "========== FLUTTER APK BUILD RESULT =========="
          echo "Flutter exit code: $FLUTTER_EXIT"

          FLUTTER_APK="build/app/outputs/flutter-apk/app-release.apk"
          GRADLE_APK="android/app/build/outputs/flutter-apk/app-release.apk"
          GRADLE_APK_RELEASE="android/app/build/outputs/apk/release/app-release.apk"

          echo ""
          echo "========== SEARCHING FOR APK =========="
          find . -type f -name "app-release.apk" -print 2>/dev/null || true

          echo ""
          echo "========== NORMALIZING APK OUTPUT =========="

          if [ -f "$FLUTTER_APK" ]; then
            echo "APK already exists at:"
            echo "$FLUTTER_APK"

          elif [ -f "$GRADLE_APK" ]; then
            echo "APK found at:"
            echo "$GRADLE_APK"

            mkdir -p "$(dirname "$FLUTTER_APK")"
            cp "$GRADLE_APK" "$FLUTTER_APK"

            echo "APK copied to:"
            echo "$FLUTTER_APK"

          elif [ -f "$GRADLE_APK_RELEASE" ]; then
            echo "APK found at:"
            echo "$GRADLE_APK_RELEASE"

            mkdir -p "$(dirname "$FLUTTER_APK")"
            cp "$GRADLE_APK_RELEASE" "$FLUTTER_APK"

            echo "APK copied to:"
            echo "$FLUTTER_APK"

          else
            echo ""
            echo "========== APK NOT FOUND =========="

            echo ""
            echo "========== BUILD APK FILES =========="
            find build -type f -name "*.apk" -print 2>/dev/null || true

            echo ""
            echo "========== ANDROID APK FILES =========="
            find android -type f -name "*.apk" -print 2>/dev/null || true

            echo ""
            echo "========== ANDROID BUILD OUTPUTS =========="
            find android/app/build/outputs -maxdepth 8 -type f -print 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "========== FINAL APK =========="
          test -f "$FLUTTER_APK"
          ls -lh "$FLUTTER_APK"

          if [ "$FLUTTER_EXIT" -ne 0 ]; then
            echo ""
            echo "Flutter returned exit code $FLUTTER_EXIT,"
            echo "but a valid APK was produced by Gradle."
            echo "Continuing because the APK exists."
          fi

      - name: Verify APK
        shell: bash
        run: |
          echo "========== VERIFY APK =========="
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # ------------------------------------------------------------
      # Build AAB
      # ------------------------------------------------------------
      - name: Build AAB
        shell: bash
        run: |
          set +e

          flutter build appbundle --release
          FLUTTER_EXIT=$?

          echo ""
          echo "========== FLUTTER AAB BUILD RESULT =========="
          echo "Flutter exit code: $FLUTTER_EXIT"

          FLUTTER_AAB="build/app/outputs/bundle/release/app-release.aab"
          GRADLE_AAB="android/app/build/outputs/bundle/release/app-release.aab"

          echo ""
          echo "========== SEARCHING FOR AAB =========="
          find . -type f -name "app-release.aab" -print 2>/dev/null || true

          echo ""
          echo "========== NORMALIZING AAB OUTPUT =========="

          if [ -f "$FLUTTER_AAB" ]; then
            echo "AAB already exists at:"
            echo "$FLUTTER_AAB"

          elif [ -f "$GRADLE_AAB" ]; then
            echo "AAB found at:"
            echo "$GRADLE_AAB"

            mkdir -p "$(dirname "$FLUTTER_AAB")"
            cp "$GRADLE_AAB" "$FLUTTER_AAB"

            echo "AAB copied to:"
            echo "$FLUTTER_AAB"

          else
            echo ""
            echo "========== AAB NOT FOUND =========="

            echo ""
            echo "========== BUILD AAB FILES =========="
            find build -type f -name "*.aab" -print 2>/dev/null || true

            echo ""
            echo "========== ANDROID AAB FILES =========="
            find android -type f -name "*.aab" -print 2>/dev/null || true

            echo ""
            echo "========== ANDROID BUNDLE OUTPUTS =========="
            find android/app/build/outputs -maxdepth 8 -type f -print 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "========== FINAL AAB =========="
          test -f "$FLUTTER_AAB"
          ls -lh "$FLUTTER_AAB"

          if [ "$FLUTTER_EXIT" -ne 0 ]; then
            echo ""
            echo "Flutter returned exit code $FLUTTER_EXIT,"
            echo "but a valid AAB was produced by Gradle."
            echo "Continuing because the AAB exists."
          fi

      - name: Verify AAB
        shell: bash
        run: |
          echo "========== VERIFY AAB =========="
          test -f build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/bundle/release/app-release.aab

      # ------------------------------------------------------------
      # Upload APK
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # ------------------------------------------------------------
      # Upload AAB
      # ------------------------------------------------------------
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
