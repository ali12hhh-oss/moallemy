name: Flutter Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Android project
        run: |
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK and locate output
        shell: bash
        run: |
          set +e
          flutter build apk --release
          FLUTTER_EXIT=$?

          echo ""
          echo "========== BUILD RESULT =========="
          echo "flutter build apk exit code: $FLUTTER_EXIT"
          echo ""

          echo "========== APK FILES UNDER build/ =========="
          find build -type f -name "*.apk" -print 2>/dev/null || true

          echo ""
          echo "========== APK FILES UNDER android/ =========="
          find android -type f -name "*.apk" -print 2>/dev/null || true

          echo ""
          echo "========== EXPECTED FLUTTER APK =========="
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            ls -lh build/app/outputs/flutter-apk/app-release.apk
          else
            echo "NOT FOUND: build/app/outputs/flutter-apk/app-release.apk"
          fi

          echo ""
          echo "========== GRADLE APK OUTPUTS =========="
          find android/app/build -type f -name "*.apk" -print 2>/dev/null || true

          echo ""
          echo "========== GRADLE RELEASE OUTPUTS =========="
          find android/app/build/outputs -maxdepth 6 -type f -print 2>/dev/null || true

          echo ""
          echo "========== END DIAGNOSTIC =========="

          exit $FLUTTER_EXIT

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
