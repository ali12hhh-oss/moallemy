name: Flutter Android CI

# Every push to main/master automatically runs analysis, tests, APK build and AAB build.
on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: write

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair kindergarten source deterministically
        shell: bash
        run: |
          set -euo pipefail
          file="lib/features/children/kindergarten_stage_screen_v4.dart"

          repair_file() {
            python3 - "$file" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          original = text
          stripped = text.rstrip()

          # The file ends in _NumberGameState.build(). Its valid tail must be:
          #   ],
          # );
          # }
          # }
          # Normalize only this final tail; do not rewrite the rest of the file.
          if not stripped.endswith('}'):
              if stripped.endswith(');'):
                  stripped += '\n  }\n}'
              elif stripped.endswith('],'):
                  stripped += '\n    );\n  }\n}'
              else:
                  raise SystemExit('ERROR: kindergarten file has an unexpected ending; refusing to guess.')

          if not stripped.endswith('\n'):
              stripped += '\n'

          if stripped != original:
              path.write_text(stripped, encoding='utf-8')
              print('Kindergarten source tail repaired.')
          else:
              print('Kindergarten source tail already complete.')
          PY
          }

          repair_file

          if ! git diff --quiet -- "$file"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$file"
            git commit -m "fix: repair kindergarten source tail"

            # Persist the repair without losing commits that arrive concurrently.
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Rebase failed on attempt $attempt; retrying."
              else
                repair_file
                if ! git diff --quiet -- "$file"; then
                  git add "$file"
                  git commit --amend --no-edit
                fi
                if git push origin HEAD:main; then
                  pushed=true
                  break
                fi
                echo "Push rejected on attempt $attempt; remote advanced."
              fi
              sleep 2
            done
            if [ "$pushed" != true ]; then
              echo "ERROR: Could not persist kindergarten source repair after 5 attempts."
              exit 1
            fi
          fi

      - name: Verify Android project
        run: |
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Locate and verify APK
        shell: bash
        run: |
          set -euo pipefail
          echo "APK files produced by the build:"
          find build -type f -name '*.apk' -print | sort
          apk="$(find build -type f -name 'app-release.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "ERROR: app-release.apk was not produced anywhere under build/."
            exit 1
          fi
          mkdir -p build/app/outputs/flutter-apk
          if [ "$apk" != "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "$apk" build/app/outputs/flutter-apk/app-release.apk
          fi
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Verify AAB
        run: |
          set -euo pipefail
          aab="$(find build -type f -name 'app-release.aab' -print -quit)"
          if [ -z "$aab" ]; then
            echo "ERROR: app-release.aab was not produced anywhere under build/."
            exit 1
          fi
          mkdir -p build/app/outputs/bundle/release
          if [ "$aab" != "build/app/outputs/bundle/release/app-release.aab" ]; then
            cp "$aab" build/app/outputs/bundle/release/app-release.aab
          fi
          test -s build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
