name: Flutter Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Android project
        run: |
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p build/app/outputs/flutter-apk

          APK_PATH="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not found."
            echo "Available APK files:"
            find android/app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "APK found: $APK_PATH"
          cp "$APK_PATH" build/app/outputs/flutter-apk/app-release.apk

          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Build AAB with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon

      - name: Collect AAB
        run: |
          mkdir -p build/app/outputs/bundle/release

          AAB_PATH="$(find android/app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)"

          if [ -z "$AAB_PATH" ]; then
            echo "ERROR: AAB was not found."
            echo "Available AAB files:"
            find android/app/build/outputs -type f -name '*.aab' -print || true
            exit 1
          fi

          echo "AAB found: $AAB_PATH"
          cp "$AAB_PATH" build/app/outputs/bundle/release/app-release.aab

          test -f build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
