name: Flutter Android CI

# Every push to main/master automatically runs analysis, tests, APK build and AAB build.
on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Android project
        run: |
          set -euo pipefail
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Test
        run: flutter test

      # Do not use `flutter build apk` here. The Android Gradle build is
      # completing, but the Flutter CLI cannot find the APK in this project
      # layout. Build the real Gradle release task and verify its output directly.
      - name: Build APK with Gradle
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace app:assembleRelease

      - name: Locate and verify APK
        shell: bash
        run: |
          set -euo pipefail
          echo "APK files produced by Gradle:"
          find android/app/build -type f -name '*.apk' -print | sort
          apk="$(find android/app/build -type f -name 'app-release.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "ERROR: app-release.apk was not produced by Gradle."
            exit 1
          fi
          mkdir -p build/app/outputs/flutter-apk
          cp "$apk" build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Build AAB with Gradle
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace app:bundleRelease

      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail
          echo "AAB files produced by Gradle:"
          find android/app/build -type f -name '*.aab' -print | sort
          aab="$(find android/app/build -type f -name 'app-release.aab' -print -quit)"
          if [ -z "$aab" ]; then
            echo "ERROR: app-release.aab was not produced by Gradle."
            exit 1
          fi
          mkdir -p build/app/outputs/bundle/release
          cp "$aab" build/app/outputs/bundle/release/app-release.aab
          test -s build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: daleel-child-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
