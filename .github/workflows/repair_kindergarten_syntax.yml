name: Repair kindergarten syntax

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair kindergarten Dart syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/children/kindergarten_stage_screen_v4.dart')
          lines = p.read_text().splitlines()

          # Remove the stray final closing brace that is outside any declaration.
          while lines and not lines[-1].strip():
              lines.pop()
          if lines and lines[-1].strip() == '}':
              lines.pop()

          # Replace the fragile collection-for/spread expression with a simple
          # list expansion so the Dart parser cannot misread the closing tokens.
          old = "    return Directionality(textDirection: TextDirection.rtl, child: Scaffold(appBar: AppBar(title: Text(kg2?'الروضة الثانية':'الروضة الأولى')),body: ListView(padding:const EdgeInsets.all(16),children:[for(final i in items)...[_MenuCard(i.title,i.subtitle,i.icon,()=>_open(context,i.title)),const SizedBox(height:12)]]));"
          new = "    final menuChildren = <Widget>[];\n    for (final i in items) {\n      menuChildren.add(_MenuCard(i.title, i.subtitle, i.icon, () => _open(context, i.title)));\n      menuChildren.add(const SizedBox(height: 12));\n    }\n    return Directionality(textDirection: TextDirection.rtl, child: Scaffold(appBar: AppBar(title: Text(kg2 ? 'الروضة الثانية' : 'الروضة الأولى')), body: ListView(padding: const EdgeInsets.all(16), children: menuChildren)));"
          if old in lines:
              lines[lines.index(old)] = new
          else:
              # The source is currently minified into fixed lines; locate the return line.
              for i, line in enumerate(lines):
                  if line.strip().startswith('return Directionality(') and 'children:[for(final i in items)' in line:
                      lines[i] = new
                      break

          p.write_text('\n'.join(lines) + '\n')
          PY

          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/features/children/kindergarten_stage_screen_v4.dart
            git commit -m 'fix: repair kindergarten menu syntax'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No syntax repair needed.'
          fi
