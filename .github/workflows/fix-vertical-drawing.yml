name: Fix vertical drawing input

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix drawing painter') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix malformed drawing painter in v4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/features/children/kindergarten_stage_screen_v4.dart')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'class _DrawingPainter extends CustomPainter \{.*?'
              r'@override\s+bool shouldRepaint\(covariant _DrawingPainter oldDelegate\) => true;\s*\n\}',
              re.DOTALL,
          )

          replacement = '''class _DrawingPainter extends CustomPainter {
            final Color color;
            final List<List<Offset>> strokes;
            final List<Offset> current;

            _DrawingPainter(this.color, this.strokes, this.current);

            @override
            void paint(Canvas canvas, Size size) {
              final paint = Paint()
                ..color = color
                ..strokeWidth = 11
                ..strokeCap = StrokeCap.round
                ..strokeJoin = StrokeJoin.round;

              void drawStroke(List<Offset> points) {
                for (var i = 1; i < points.length; i++) {
                  canvas.drawLine(points[i - 1], points[i], paint);
                }
              }

              for (final stroke in strokes) {
                drawStroke(stroke);
              }

              drawStroke(current);
            }

            @override
            bool shouldRepaint(covariant _DrawingPainter oldDelegate) => true;
          }'''

          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 _DrawingPainter class, replaced {count}')

          path.write_text(text, encoding='utf-8')
          print('Fixed _DrawingPainter in kindergarten_stage_screen_v4.dart')
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/children/kindergarten_stage_screen_v4.dart
          git rm -f .github/workflows/fix-vertical-drawing.yml
          git commit -m "Fix drawing painter"
          git push
