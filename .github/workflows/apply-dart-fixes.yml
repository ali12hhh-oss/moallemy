name: Apply remaining Dart analyze fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Dart files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          k = Path('lib/features/children/kindergarten_stage_screen_v4.dart')
          t = k.read_text(encoding='utf-8')
          if "import 'dart:math' as math;" not in t:
              t = "import 'dart:math' as math;\n" + t
          t = t.replace('..scale(1.02)', '..scaleByDouble(1.02)')
          t = t.replace('Math.cos(a)', 'math.cos(a)').replace('Math.sin(a)', 'math.sin(a)')
          t = t.replace('fontWeight: FontWeight.w900))))),\n    ]);', 'fontWeight: FontWeight.w900)))))) ,\n    ]);')
          k.write_text(t, encoding='utf-8')

          f = Path('lib/features/quiz/final_exam_screen_v8.dart')
          t = f.read_text(encoding='utf-8')
          if "import 'dart:math' as math;" not in t:
              t = "import 'dart:math' as math;\n" + t
          t = t.replace('Math.cos(a)', 'math.cos(a)').replace('Math.sin(a)', 'math.sin(a)')
          t = t.replace('child: Text(option, style: const TextStyle(fontSize: 21))))),', 'child: Text(option, style: const TextStyle(fontSize: 21))))));')
          f.write_text(t, encoding='utf-8')
          PY
      - name: Commit fixes and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/children/kindergarten_stage_screen_v4.dart lib/features/quiz/final_exam_screen_v8.dart
          git commit -m "fix: resolve remaining Dart analyze errors" || true
          git rm -f .github/workflows/apply-dart-fixes.yml
          git commit -m "chore: remove temporary fix workflow" || true
          git push
