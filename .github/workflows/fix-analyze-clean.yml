name: Kindergarten palette cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove incorrect pink palette and mismatched coloring drawings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/children/kindergarten_stage_screen_v4.dart')
          t = p.read_text(encoding='utf-8')

          t = t.replace(
              'static const colors = <Color>[Colors.black, Colors.red, Colors.blue, Colors.green, Colors.orange, Colors.purple, Colors.pink];',
              'static const colors = <Color>[Colors.black, Colors.red, Colors.blue, Colors.green, Colors.orange, Colors.purple];',
          )
          t = t.replace(
              "  final colors = const <Color>[Color(0xFFF44336), Color(0xFF2196F3), Color(0xFFFFC107), Color(0xFF4CAF50), Color(0xFFFF8A00), Color(0xFF8E5CF6), Color(0xFFE91E63), Color(0xFF00AFA5)];\n  final names = const ['أحمر','أزرق','أصفر','أخضر','برتقالي','بنفسجي','وردي','تركوازي'];",
              "  final colors = const <Color>[Color(0xFFF44336), Color(0xFF2196F3), Color(0xFFFFC107), Color(0xFF4CAF50), Color(0xFFFF8A00), Color(0xFF8E5CF6), Color(0xFF00AFA5)];\n  final names = const ['أحمر','أزرق','أصفر','أخضر','برتقالي','بنفسجي','تركوازي'];",
          )
          t = t.replace("  final drawings = const ['قطة','سمكة','أرنب','فراشة','فيل'];", "  final drawings = const ['قطة'];")
          t = t.replace("String drawingsLabel(int i) => const ['قطة','سمكة','أرنب','فراشة','فيل'][i];", "String drawingsLabel(int i) => const ['قطة'][i];")

          p.write_text(t, encoding='utf-8')
          PY
          dart format lib/features/children/kindergarten_stage_screen_v4.dart
          flutter analyze --fatal-warnings
      - name: Commit changes and remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/children/kindergarten_stage_screen_v4.dart
          git commit -m "fix: remove incorrect pink and mismatched coloring drawings" || true
          git rm -f .github/workflows/fix-analyze-clean.yml || true
          git commit -m "chore: remove temporary cleanup workflow" || true
          git push || true
